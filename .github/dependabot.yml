version: 2

# Groups keep packages that release together, or must move together, in one PR.
# They are drawn from past Dependabot PRs that arrived as separate pairs for the
# same release (vitest #101 + @vitest/coverage-v8 #100, #92 + #90, #49 + #45) or
# for one toolchain (semantic-release #88, #84, #85, #86; typescript-eslint,
# globals and @eslint/js).
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "friday"
          time: "22:00"
          timezone: "Australia/Sydney"
      open-pull-requests-limit: 20
      groups:
          # @vitest/coverage-v8 is pinned to vitest's exact version.
          vitest:
              patterns: ["vitest", "@vitest/*"]
          semantic-release:
              patterns:
                  [
                      "semantic-release",
                      "@semantic-release/*",
                      "conventional-changelog-*",
                  ]
          eslint:
              patterns:
                  [
                      "eslint",
                      "@eslint/*",
                      "eslint-plugin-*",
                      "typescript-eslint",
                      "globals",
                  ]
      ignore:
          # TypeScript majors need a coordinated typescript-eslint upgrade, tracked in #65
          - dependency-name: "typescript"
            update-types: ["version-update:semver-major"]
          # @types/node must not be newer than the Node major in .nvmrc; bump both together
          - dependency-name: "@types/node"
            update-types: ["version-update:semver-major"]
          # 10.4.0+ requires conventional-changelog-writer@9; @semantic-release/release-notes-generator@14 still ships writer@8
          - dependency-name: "conventional-changelog-conventionalcommits"
            versions: [">=10.4.0"]
